<footer class="site-footer">
  <div class="container footer-inner">
    {{ with .Site.Params.footerLogo }}
      <a href="{{ $.Site.Params.footerLogoUrl }}" class="footer-logo">
        <img src="{{ . }}" alt="The University of Osaka" loading="lazy">
      </a>
    {{ end }}
    <div class="footer-meta">
      <a class="footer-link" href="{{ "/privacy/" | relLangURL }}">{{ i18n "privacy" }}</a>
      <p class="copyright">© {{ now.Year }} {{ .Site.Params.copyrightName }}</p>
    </div>
  </div>
</footer>
